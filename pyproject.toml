[project]
name = "excel-template-writer"
version = "0.1.0"
description = "A spatial, declarative template interpreter for XLSX workbooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
polars = [
    "polars>=1.43.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.16,<0.17",
    "ty>=0.0.70,<0.1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
